name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tag is published
        with:
          python-version: "3.14"
      - run: uv sync --locked
      # No Ollama and no Telegram credentials here: those tests stay local.
      - run: uv run pytest -m "not ollama and not telegram"
