# Build the image the k3s CronJobs run (k3s/standup.yaml); on main, publish it.
#
# arm64 native: the k3s node is rancher-desktop on Apple silicon.
# Tags: :main (what the CronJob pulls) and :sha-<commit> (to pin or roll back).
name: image

on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "uv.lock", "src/**", ".github/workflows/image.yml"]
  push:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "uv.lock", "src/**", ".github/workflows/image.yml"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/silverbeer/cycle-runner-adk

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test and size budget
        run: |
          docker buildx build --load -t smoke .
          docker run --rm smoke cycle_runner.standup --help
          # SB-1216: 1.35 GB before, ~90 MB after. Fail rather than regrow quietly.
          budget_mb=150
          size_mb=$(( $(docker image inspect smoke --format '{{.Size}}') / 1000000 ))
          echo "image size: ${size_mb} MB (budget ${budget_mb} MB)"
          [ "$size_mb" -le "$budget_mb" ] || { echo "::error::image is ${size_mb} MB, over the ${budget_mb} MB budget"; exit 1; }
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
