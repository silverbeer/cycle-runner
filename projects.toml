# Cycle Runner projects: where each project's work happens, and how it's checked.
#
# A project id is the issue's label in Linear's "repo" label group (MT, TRD, ...).
# Adding a project means adding a [projects.X] table here, with no code changes.
#
# For every work request the executor runs on, Cycle Runner makes a fresh clone
# of the project's repository under workspace_root (e.g. .../WR-000002) and
# removes its origin remote. The repository itself is only read, never changed.
#
#   repository    a local git checkout (~ allowed)
#   test_command  the exact command that checks the work, run inside the clone.
#                 It is the only command the coding agent may run, so no shell
#                 operators (use `uv run --directory backend ...`, not `cd && ...`).
#   readable      optional: extra paths sandboxed tests may read
#   branch        optional: the branch to clone (default: whatever the checkout
#                 has checked out, which may be someone's feature branch)
#   setup_command optional: prepares dependencies in the clone before the agent
#                 starts. Runs outside the agent's sandbox, with network, so
#                 it's restricted to a package manager's install step (uv sync,
#                 npm ci, ...), optionally behind `env NAME=value`, with paths
#                 inside the clone only. A failure fails the request unstarted.
#   setup_produces optional: clone-relative paths setup must create; each must
#                 resolve inside the clone (a venv symlinked into ~ would be
#                 unreadable in the sandbox)
#   test_success_pattern optional: a regex the agent's last test run output must
#                 match (checked by the executor, not taken from the agent)
#
# Runnable by the Claude executor: MT (V1.2). The others still need their
# dependencies set up the same way before an agent can run their tests.

workspace_root = "~/.local/share/cycle-runner/workspaces"

[projects.MT]    # missing-table
repository = "~/gitrepos/missing-table"
branch = "main"
# A workspace-local interpreter (.python) and venv (backend/.venv), so the
# sandboxed tests never need ~/.local/share/uv or ~/.cache.
setup_command = "env UV_PYTHON_INSTALL_DIR=.python UV_PYTHON_PREFERENCE=only-managed uv sync --directory backend --frozen"
setup_produces = ["backend/.venv/bin/python"]
# Unit tests only, as MT's CI runs them, from backend/ (conftest loads ../.env.test).
#   PATH=/usr/bin:/bin   keeps `op` off PATH: one MT test shells out to it and
#                        the sandbox can't run it (PermissionError)
#   -o addopts=          drops -v, coverage and --strict-config noise from pytest.ini
#   --capture=no         pytest's capture dies in the sandbox (exit 120)
test_command = "/usr/bin/env -C backend PATH=/usr/bin:/bin .venv/bin/python -m pytest tests/unit -o addopts= -o log_cli=false -n auto -q --capture=no"
test_success_pattern = '^\d+ passed(, \d+ (skipped|deselected|xfailed|xpassed|warnings?))* in [\d.]+s'

[projects.MTA]   # missing-table-android
repository = "~/gitrepos/missing-table-android"
test_command = "./gradlew test"

[projects.TRD]   # trd
repository = "~/gitrepos/trd"
test_command = "uv run pytest -q"

[projects.JT]    # janitor
repository = "~/gitrepos/janitor"
test_command = "uv run pytest -q"

# BET (bet) and QB (qualityplaybook.dev) aren't cloned on this machine yet.
# Add them the same way once they are, for example:
#
# [projects.BET]
# repository = "~/gitrepos/bet"
# test_command = "uv run pytest -q"
