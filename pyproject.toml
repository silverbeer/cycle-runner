[project]
name = "cycle-runner"
version = "0.1.0"
description = "Weekly engineering-cycle agent built on Google ADK and a local Ollama model"
readme = "README.md"
authors = [
    { name = "silverbeer", email = "silverbeer.io@gmail.com" }
]
requires-python = ">=3.14"
# Core: what the scheduled jobs (the standup) import. Kept small, because the
# k3s image installs only this (SB-1216). The heavy parts are dependency
# groups below, installed by default everywhere else.
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "python-telegram-bot>=22.8",
]

[project.scripts]
# Needs the `scrum` dependency group (installed by default by `uv sync`).
scrum-master = "cycle_runner.scrum.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# The conversation: ADK and LiteLLM (to Ollama).
agent = [
    "google-adk>=2.10.0",
    "litellm>=1.102.1",
]
# The coding executor: a real Claude coding agent.
executor = [
    "claude-agent-sdk>=0.2.160",
]
# The Scrum Master report CLI (SB-1385): Typer and Rich, kept out of the k3s image.
scrum = [
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[tool.uv]
# `uv run` and `uv sync` keep installing everything locally and in CI; the
# Dockerfile opts out with --no-default-groups.
default-groups = ["dev", "agent", "executor", "scrum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ollama: talks to a live local Ollama server (skipped if unreachable)",
    "telegram: talks to the real Telegram API (skipped unless TELEGRAM_BOT_TOKEN is set)",
    "linear: talks to the real Linear API (skipped unless run under `op run` with Linear credentials)",
    "claude: runs a real Claude coding agent (skipped unless CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY is set)",
    "github: pushes to and opens draft PRs on the disposable sandbox repo (skipped unless CYCLE_RUNNER_GITHUB_TOKEN is set)",
    "github_read: reads the real GitHub API with the Scrum Master's read-only token (skipped unless SCRUM_GITHUB_TOKEN is set)",
]
